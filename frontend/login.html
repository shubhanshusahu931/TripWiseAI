<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — TripWise AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo-group">
        <div class="logo-icon">✈️</div>
        <div class="logo-text">TripWise<span>AI</span></div>
      </a>
      <div class="nav-actions">
        <span style="font-size: 0.9rem; color: var(--text-muted);">Don't have an account?</span>
        <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Auth Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to view your personalized itineraries</p>
      </div>

      <!-- Quick Try Demo Account Button -->
      <button type="button" class="auth-demo-btn" id="demo-login-btn">
        <span>⚡</span>
        <span>Quick Try: Demo Account</span>
      </button>

      <div class="auth-divider">or log in with email</div>

      <!-- Standard Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-group">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Protected with Supabase Auth & PostgreSQL RLS
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
