<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — TripWise AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo-group">
        <div class="logo-icon">✈️</div>
        <div class="logo-text">TripWise<span>AI</span></div>
      </a>
      <div class="nav-actions">
        <span style="font-size: 0.9rem; color: var(--text-muted);">Already have an account?</span>
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <!-- Auth Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start planning personalized travel itineraries with AI</p>
      </div>

      <!-- Quick Try Demo Account Button -->
      <button type="button" class="auth-demo-btn" id="demo-login-btn">
        <span>⚡</span>
        <span>Quick Try: Demo Account</span>
      </button>

      <div class="auth-divider">or create account with email</div>

      <!-- Registration Form -->
      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
          Create Free Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Log in here</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
